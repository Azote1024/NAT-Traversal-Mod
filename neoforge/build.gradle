plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def quicProtocolSupportRepoUrl = (
        project.findProperty("quicProtocolSupportRepoUrl")?.toString()
                ?: System.getenv("QUIC_PROTOCOL_SUPPORT_REPO_URL")
                ?: "https://codeberg.org/tesinormed/QuicProtocolSupport.git"
)

def quicJarNames = [
        "netty-incubator-codec-classes-quic-0.0.73.Final-SNAPSHOT.jar",
        "netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-windows-x86_64.jar",
        "netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-linux-x86_64.jar",
        "netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-linux-aarch_64.jar"
]

def quicRefLibDir = file("../ref/quicprotocolsupport/libs")
def quicBootstrapRepoDir = file("$buildDir/quicprotocolsupport-src")
def quicBootstrapLibDir = file("$buildDir/quicprotocolsupport-bootstrap/libs")

def resolveQuicJarFile = { String jarName ->
    File refJar = file("../ref/quicprotocolsupport/libs/${jarName}")
    if (refJar.exists()) {
        return refJar
    }
    return file("$buildDir/quicprotocolsupport-bootstrap/libs/${jarName}")
}

def prepareQuicRuntimeLibs = tasks.register("prepareQuicRuntimeLibs") {
    group = "build setup"
    description = "Ensures QUIC runtime jars are available from ../ref or bootstraps from QuicProtocolSupport repository."
    outputs.files(quicJarNames.collect { file("$buildDir/quicprotocolsupport-bootstrap/libs/${it}") })

    doLast {
        List<String> missingInRef = quicJarNames.findAll { !new File(quicRefLibDir, it).exists() }
        if (missingInRef.isEmpty()) {
            return
        }

        if (!quicBootstrapRepoDir.exists()) {
            try {
                exec {
                    commandLine "git", "--version"
                }
            } catch (Exception exception) {
                throw new GradleException(
                        "QUIC libs are missing in ${quicRefLibDir}. Git is required to bootstrap them. " +
                                "Install Git or provide jars under ../ref/quicprotocolsupport/libs.",
                        exception
                )
            }

            logger.lifecycle("[nat-traversal-mod] Bootstrapping QUIC libs: cloning {}", quicProtocolSupportRepoUrl)
            exec {
                commandLine "git", "clone", "--depth", "1", quicProtocolSupportRepoUrl, quicBootstrapRepoDir.absolutePath
            }
        }

        File clonedLibDir = new File(quicBootstrapRepoDir, "libs")
        if (!clonedLibDir.isDirectory()) {
            throw new GradleException("Bootstrap source does not contain libs directory: ${clonedLibDir}")
        }

        quicBootstrapLibDir.mkdirs()
        missingInRef.each { String jarName ->
            File sourceJar = new File(clonedLibDir, jarName)
            if (!sourceJar.exists()) {
                throw new GradleException("Missing required QUIC jar in cloned repository: ${sourceJar}")
            }
            copy {
                from sourceJar
                into quicBootstrapLibDir
            }
        }

        List<String> stillMissing = quicJarNames.findAll { !resolveQuicJarFile(it).exists() }
        if (!stillMissing.isEmpty()) {
            throw new GradleException("QUIC runtime jars are still missing after bootstrap: ${stillMissing}")
        }
    }
}

def quicClassesJar = resolveQuicJarFile("netty-incubator-codec-classes-quic-0.0.73.Final-SNAPSHOT.jar")
def quicNativeWinJar = resolveQuicJarFile("netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-windows-x86_64.jar")
def quicNativeLinuxX64Jar = resolveQuicJarFile("netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-linux-x86_64.jar")
def quicNativeLinuxArm64Jar = resolveQuicJarFile("netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-linux-aarch_64.jar")


dependencies {
    implementation files(quicClassesJar)
    jarJar files(quicClassesJar)
    runtimeOnly files(quicNativeWinJar)
    runtimeOnly files(quicNativeLinuxX64Jar)
    runtimeOnly files(quicNativeLinuxArm64Jar)
}

tasks.withType(JavaExec).configureEach {
    dependsOn prepareQuicRuntimeLibs
    // NeoForge run tasks don't always inherit file() dependencies reliably; force QUIC jars into launch classpaths.
    classpath += files(quicClassesJar, quicNativeWinJar, quicNativeLinuxX64Jar, quicNativeLinuxArm64Jar)
}

tasks.withType(JavaCompile).configureEach {
    dependsOn prepareQuicRuntimeLibs
}

def quicRuntimeJarPaths = [quicClassesJar, quicNativeWinJar, quicNativeLinuxX64Jar, quicNativeLinuxArm64Jar]
        .collect { it.absolutePath }
def clientLegacyClasspathPath = file("$buildDir/moddev/clientLegacyClasspath.txt").absolutePath
def serverLegacyClasspathPath = file("$buildDir/moddev/serverLegacyClasspath.txt").absolutePath
def clientLog4j2Path = file("$buildDir/moddev/clientLog4j2.xml").absolutePath
def serverLog4j2Path = file("$buildDir/moddev/serverLog4j2.xml").absolutePath
def quicVerboseLogs = (
        project.findProperty("natQuicVerboseLogs")?.toString()?.toBoolean()
                ?: System.getenv("NAT_QUIC_VERBOSE_LOGS")?.toBoolean()
                ?: false
)

def quicNoiseLoggerBeginMarker = '<!-- NAT-TRAVERSAL-MOD QUIC-LOG-SUPPRESSION BEGIN -->'
def quicNoiseLoggerEndMarker = '<!-- NAT-TRAVERSAL-MOD QUIC-LOG-SUPPRESSION END -->'
def quicNoiseLoggerBlock = '''
        <!-- NAT-TRAVERSAL-MOD QUIC-LOG-SUPPRESSION BEGIN -->
        <!-- Reduce QUIC/Netty transport noise in debug.log to keep NAT route diagnostics readable -->
        <Logger level="warn" name="io.netty.incubator.codec.quic"/>
        <Logger level="warn" name="io.netty.channel.DefaultChannelPipeline"/>
        <Logger level="warn" name="io.netty.util.Recycler"/>
        <!-- NAT-TRAVERSAL-MOD QUIC-LOG-SUPPRESSION END -->
'''

def removeQuicNoiseBlock = { String text ->
    int beginIndex = text.indexOf(quicNoiseLoggerBeginMarker)
    int endIndex = text.indexOf(quicNoiseLoggerEndMarker)
    if (beginIndex < 0 || endIndex < 0 || endIndex < beginIndex) {
        return text
    }
    int afterEnd = endIndex + quicNoiseLoggerEndMarker.length()
    return text.substring(0, beginIndex) + text.substring(afterEnd)
}

def patchModDevLog4j = { String path ->
    File log4jFile = new File(path)
    if (!log4jFile.exists()) {
        return
    }

    String original = log4jFile.getText('UTF-8')
    String text = removeQuicNoiseBlock(original)

    if (quicVerboseLogs) {
        if (text != original) {
            log4jFile.write(text, 'UTF-8')
        }
        return
    }

    int rootIndex = text.indexOf('<Root level="DEBUG">')
    if (rootIndex < 0) {
        return
    }

    String patched = text.substring(0, rootIndex) + quicNoiseLoggerBlock + text.substring(rootIndex)
    if (patched != original) {
        log4jFile.write(patched, 'UTF-8')
    }
}

tasks.matching { it.name == "writeClientLegacyClasspath" }.configureEach {
    dependsOn prepareQuicRuntimeLibs
    doLast {
        File legacyClasspathFile = new File(clientLegacyClasspathPath)
        if (!legacyClasspathFile.exists()) {
            return
        }

        List<String> existingLines = legacyClasspathFile.readLines("UTF-8")
        Set<String> existing = new LinkedHashSet<>(existingLines)
        List<String> missing = quicRuntimeJarPaths.findAll { !existing.contains(it) }
        if (missing.isEmpty()) {
            return
        }

        String prefix = existingLines.isEmpty() ? "" : System.lineSeparator()
        legacyClasspathFile << prefix + missing.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.matching { it.name == "writeServerLegacyClasspath" }.configureEach {
    dependsOn prepareQuicRuntimeLibs
    doLast {
        File legacyClasspathFile = new File(serverLegacyClasspathPath)
        if (!legacyClasspathFile.exists()) {
            return
        }

        List<String> existingLines = legacyClasspathFile.readLines("UTF-8")
        Set<String> existing = new LinkedHashSet<>(existingLines)
        List<String> missing = quicRuntimeJarPaths.findAll { !existing.contains(it) }
        if (missing.isEmpty()) {
            return
        }

        String prefix = existingLines.isEmpty() ? "" : System.lineSeparator()
        legacyClasspathFile << prefix + missing.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.matching { it.name == "prepareClientRun" }.configureEach {
    doLast {
        patchModDevLog4j(clientLog4j2Path)
    }
}

tasks.matching { it.name == "prepareServerRun" }.configureEach {
    doLast {
        patchModDevLog4j(serverLog4j2Path)
    }
}

tasks.matching { it.name == "runClient" }.configureEach {
    doFirst {
        patchModDevLog4j(clientLog4j2Path)
    }
}

tasks.matching { it.name == "runServer" }.configureEach {
    doFirst {
        patchModDevLog4j(serverLog4j2Path)
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
