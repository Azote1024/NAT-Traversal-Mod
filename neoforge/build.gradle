plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def quicClassesJar = file("../ref/quicprotocolsupport/libs/netty-incubator-codec-classes-quic-0.0.73.Final-SNAPSHOT.jar")
def quicNativeWinJar = file("../ref/quicprotocolsupport/libs/netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-windows-x86_64.jar")
def quicNativeLinuxX64Jar = file("../ref/quicprotocolsupport/libs/netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-linux-x86_64.jar")
def quicNativeLinuxArm64Jar = file("../ref/quicprotocolsupport/libs/netty-incubator-codec-native-quic-0.0.73.Final-SNAPSHOT-linux-aarch_64.jar")


dependencies {
    implementation files(quicClassesJar)
    jarJar files(quicClassesJar)
    runtimeOnly files(quicNativeWinJar)
    runtimeOnly files(quicNativeLinuxX64Jar)
    runtimeOnly files(quicNativeLinuxArm64Jar)
}

tasks.withType(JavaExec).configureEach {
    // NeoForge run tasks don't always inherit file() dependencies reliably; force QUIC jars into launch classpaths.
    classpath += files(quicClassesJar, quicNativeWinJar, quicNativeLinuxX64Jar, quicNativeLinuxArm64Jar)
}

def quicRuntimeJarPaths = [quicClassesJar, quicNativeWinJar, quicNativeLinuxX64Jar, quicNativeLinuxArm64Jar]
        .collect { it.absolutePath }
def clientLegacyClasspathPath = file("$buildDir/moddev/clientLegacyClasspath.txt").absolutePath
def serverLegacyClasspathPath = file("$buildDir/moddev/serverLegacyClasspath.txt").absolutePath

tasks.matching { it.name == "writeClientLegacyClasspath" }.configureEach {
    doLast {
        File legacyClasspathFile = new File(clientLegacyClasspathPath)
        if (!legacyClasspathFile.exists()) {
            return
        }

        List<String> existingLines = legacyClasspathFile.readLines("UTF-8")
        Set<String> existing = new LinkedHashSet<>(existingLines)
        List<String> missing = quicRuntimeJarPaths.findAll { !existing.contains(it) }
        if (missing.isEmpty()) {
            return
        }

        String prefix = existingLines.isEmpty() ? "" : System.lineSeparator()
        legacyClasspathFile << prefix + missing.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.matching { it.name == "writeServerLegacyClasspath" }.configureEach {
    doLast {
        File legacyClasspathFile = new File(serverLegacyClasspathPath)
        if (!legacyClasspathFile.exists()) {
            return
        }

        List<String> existingLines = legacyClasspathFile.readLines("UTF-8")
        Set<String> existing = new LinkedHashSet<>(existingLines)
        List<String> missing = quicRuntimeJarPaths.findAll { !existing.contains(it) }
        if (missing.isEmpty()) {
            return
        }

        String prefix = existingLines.isEmpty() ? "" : System.lineSeparator()
        legacyClasspathFile << prefix + missing.join(System.lineSeparator()) + System.lineSeparator()
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
